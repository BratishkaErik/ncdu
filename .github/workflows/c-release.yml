name: "Publish release to GitHub"

on:
  workflow_dispatch:
  push:
    tags:
      # Publish on any tag starting with a `v`, e.g., v0.1.0
      - v*

permissions: { }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack-source:
    name: Package source code
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake pkg-config libncurses-dev

      - name: Archive source
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION//\//-}"
          mkdir -p dist

          TIMESTAMP=$(git log -1 --format=%ct "${GITHUB_SHA}")
          export SOURCE_DATE_EPOCH="$TIMESTAMP"
          export TAR_OPTIONS="--sort=name --mtime=@${TIMESTAMP} --owner=0 --group=0 --numeric-owner"

          autoreconf -fi
          ./configure
          make distcheck

          mv ncdu-*.tar.gz "dist/ncdu-${VERSION}-src.tar.gz"

      - name: Upload source artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: artifact-source
          path: dist/
          retention-days: 1

  publish-github:
    name: Publish to GitHub Releases
    runs-on: ubuntu-latest
    needs: [ pack-source ]
    if: startsWith(github.ref, 'refs/tags/')
    environment:
      name: github-releases
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Download clean build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: artifact-*
          path: dist/
          merge-multiple: true

      - name: Generate Artifact Attestation
        uses: actions/attest@v4.1.1
        with:
          subject-path: "dist/*"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_PRERELEASE: ${{
            contains(github.ref_name, 'rc') ||
            contains(github.ref_name, 'beta') ||
            contains(github.ref_name, 'alpha') ||
            contains(github.ref_name, 'dev') ||
            contains(github.ref_name, 'test') }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          ARGS=("--draft")
          if [ "${IS_PRERELEASE}" = "true" ]; then
            ARGS+=("--prerelease")
          fi

          export LC_ALL=C.UTF-8
          mapfile -t FILES < <(printf "%s\n" dist/* | sort -r)

          git tag -l --format='%(contents:body)' "${GITHUB_REF_NAME}" > release_notes.md
          echo -e "## GitHub generated notes" >> release_notes.md

          gh release create "${GITHUB_REF_NAME}" "${FILES[@]}" \
            --title "Release ${GITHUB_REF_NAME}" \
            --notes-file release_notes.md \
            --generate-notes \
            "${ARGS[@]}"
