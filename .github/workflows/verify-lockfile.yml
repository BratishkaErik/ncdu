name: Verify Actions Lockfile

on:
  push:
    branches:
      - zig-version
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-slim
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify